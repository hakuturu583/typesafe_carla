name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: catch ue5-dev changes that break the shim before a release does.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      carla_ref:
        description: "Extra CARLA ref (branch, tag or SHA) to build LibCarla from"
        required: false

jobs:
  test:
    # Mock backend: compile-pass/fail, runtime and launcher tests, no CARLA needed.
    runs-on: ubuntu-24.04
    env:
      TSC_BACKEND: mock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: C++ build (mock backend)
        run: |
          cmake -S . -B build -DTSC_BACKEND=mock
          cmake --build build -j "$(nproc)"
      - name: Native ABI tests
        run: ctest --test-dir build --output-on-failure

      # Builds the toolchain workspace member, i.e. installs the pinned Codon:
      # no Codon is preinstalled on the runner.
      - name: uv sync (locked)
        run: uv sync --frozen
      - run: uv run typesafe-codon info
      - name: Compile-pass, compile-fail, runtime and launcher tests
        run: uv run pytest -v
      # The binding spec (bindings/*.yaml) against the mock's LibCarla mirror.
      # libclang finds clang's builtin headers through the runner's clang.
      - name: Binding spec vs mock headers
        run: uv run python -m tools.bindgen validate --build-dir build

  libcarla:
    # The shim compiled and linked against real LibCarla built from CARLA
    # sources. Runs the C ABI tests that need no server.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        carla_ref: ${{ fromJSON(inputs.carla_ref && format('["ue5-dev","{0}"]', inputs.carla_ref) || '["ue5-dev"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure (CARLA ${{ matrix.carla_ref }})
        run: cmake -S . -B build -DTSC_BACKEND=libcarla -DTSC_CARLA_GIT_REF=${{ matrix.carla_ref }}
      - name: Build
        # A bare -j means unlimited jobs; LibCarla/Boost TUs need ~1-2 GB each.
        run: cmake --build build -j "$(nproc)" --target typesafe_carla_ffi test_ffi test_generated
      - name: Native ABI tests
        run: ctest --test-dir build --output-on-failure
      - uses: astral-sh/setup-uv@v6
      # --no-project: only the generator's dependencies, not a second
      # LibCarla build of the package.
      - name: Binding spec vs LibCarla headers
        run: uv run --no-project --with pyyaml --with libclang==18.1.1 python -m tools.bindgen validate --build-dir build
      - name: LibCarla API coverage report
        run: |
          uv run --no-project --with pyyaml --with libclang==18.1.1 python -m tools.bindgen coverage --build-dir build -o coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

  wheel:
    # The wheel used from a clean environment outside the checkout, so nothing
    # can fall back to repository paths. (Mock backend to keep it fast; the
    # release workflow builds and checks the LibCarla wheel.)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build wheels
        run: |
          uv build --wheel toolchain -o dist
          TSC_BACKEND=mock uv build --wheel -o dist
      - name: Install into a clean environment and run an example
        run: |
          mkdir "$RUNNER_TEMP/clean" && cp examples/connect.py "$RUNNER_TEMP/clean/"
          cd "$RUNNER_TEMP/clean"
          uv venv
          uv pip install --find-links "$GITHUB_WORKSPACE/dist" typesafe-carla
          .venv/bin/typesafe-codon info
          .venv/bin/typesafe-codon run connect.py
          .venv/bin/typesafe-codon build -release -o connect connect.py
          env -u TYPESAFE_CARLA_LIB ./connect
