name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CODON_VERSION: "0.19.3"

jobs:
  test:
    # Mock backend: no CARLA server or LibCarla build needed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install Codon ${{ env.CODON_VERSION }}
        run: |
          curl -fsSL -o codon.tar.gz \
            "https://github.com/exaloop/codon/releases/download/v${CODON_VERSION}/codon-linux-x86_64.tar.gz"
          mkdir -p "$RUNNER_TEMP/codon"
          tar xzf codon.tar.gz -C "$RUNNER_TEMP/codon" --strip-components=1
          echo "TYPESAFE_CODON=$RUNNER_TEMP/codon/bin/codon" >> "$GITHUB_ENV"

      - name: C++ build (mock backend)
        run: |
          cmake -S . -B build -DTSC_BACKEND=mock
          cmake --build build -j

      - name: Native ABI tests
        run: ctest --test-dir build --output-on-failure

      - name: uv sync (locked)
        run: uv sync --frozen

      - name: Compile-pass, compile-fail, runtime and launcher tests
        run: uv run pytest -v

  wheel:
    # Builds the wheel and uses it from a clean environment outside the
    # checkout, so nothing can fall back to repository paths.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install Codon ${{ env.CODON_VERSION }}
        run: |
          curl -fsSL -o codon.tar.gz \
            "https://github.com/exaloop/codon/releases/download/v${CODON_VERSION}/codon-linux-x86_64.tar.gz"
          mkdir -p "$RUNNER_TEMP/codon"
          tar xzf codon.tar.gz -C "$RUNNER_TEMP/codon" --strip-components=1
          echo "TYPESAFE_CODON=$RUNNER_TEMP/codon/bin/codon" >> "$GITHUB_ENV"

      - name: Build wheel
        run: TSC_BACKEND=mock uv build --wheel -o dist

      - name: Install into a clean environment and run an example
        run: |
          mkdir "$RUNNER_TEMP/clean" && cp examples/connect.py "$RUNNER_TEMP/clean/"
          cd "$RUNNER_TEMP/clean"
          uv venv
          uv pip install "$GITHUB_WORKSPACE"/dist/*.whl
          .venv/bin/typesafe-codon info
          .venv/bin/typesafe-codon run connect.py
          .venv/bin/typesafe-codon build -release -o connect connect.py
          env -u TYPESAFE_CARLA_LIB ./connect

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
