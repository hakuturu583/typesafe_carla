name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: catch ue5-dev changes that break the shim before a release does.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      carla_ref:
        description: "Extra CARLA ref (branch, tag or SHA) to build LibCarla from"
        required: false

jobs:
  test:
    # Mock backend: compile-pass/fail, runtime and launcher tests, no CARLA needed.
    # Python only runs the launcher, build hook and dev tools: test the oldest
    # and newest supported versions (requires-python >= 3.10).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    env:
      TSC_BACKEND: mock
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: C++ build (mock backend)
        run: |
          cmake -S . -B build -DTSC_BACKEND=mock
          cmake --build build -j "$(nproc)"
      - name: Native ABI tests
        run: ctest --test-dir build --output-on-failure

      # Builds the toolchain workspace member, i.e. installs the pinned Codon:
      # no Codon is preinstalled on the runner.
      - name: uv sync (locked)
        run: uv sync --frozen
      - run: uv run typesafe-codon info
      - name: Compile-pass, compile-fail, runtime and launcher tests
        run: uv run pytest -v
      # The binding spec (bindings/*.yaml) against the mock's LibCarla mirror.
      # libclang finds clang's builtin headers through the runner's clang.
      - name: Binding spec vs mock headers
        run: uv run python -m tools.bindgen validate --build-dir build

  libcarla:
    # The shim compiled and linked against real LibCarla built from CARLA
    # sources. Runs the C ABI tests that need no server. Every current Ubuntu
    # LTS with that release's default GCC (users build LibCarla and the shim
    # with their distribution's compiler; a manylinux/gcc-toolset prebuilt
    # does not mix with it), times ue5-dev and 0.10.0 (the test server's).
    # LibCarla is built from the ref's current commit SHA, and build/ is
    # cached keyed by that SHA and the toolchain (docs/releasing.md,
    # "LibCarla build cache").
    name: libcarla (${{ matrix.os.runner }} gcc-${{ matrix.os.gcc }}, ${{ matrix.carla_ref }})
    runs-on: ${{ matrix.os.runner }}
    env:
      # The release's default GCC, never a newer one the runner image adds.
      CC: gcc-${{ matrix.os.gcc }}
      CXX: g++-${{ matrix.os.gcc }}
      # What the source build and the build from the prebuilt both build.
      SHIM_TARGETS: typesafe_carla_ffi test_ffi test_generated test_image_converter
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 20.04 is out of standard support, and its GCC 9 lacks C++20.
        os:
          - { runner: ubuntu-22.04, gcc: 11 }
          - { runner: ubuntu-24.04, gcc: 13 }
          - { runner: ubuntu-26.04, gcc: 15 }
        carla_ref: ${{ fromJSON(inputs.carla_ref && format('["ue5-dev","0.10.0","{0}"]', inputs.carla_ref) || '["ue5-dev","0.10.0"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Resolve CARLA ${{ matrix.carla_ref }} to a commit
        id: carla
        env:
          CARLA_REF: ${{ matrix.carla_ref }}
          OS: ${{ matrix.os.runner }}
          GCC: ${{ matrix.os.gcc }}
        run: |
          set -euo pipefail
          "$CXX" --version | sed -n 1p
          sha=$(tools/resolve_carla_ref.sh "$CARLA_REF")
          echo "CARLA ${CARLA_REF} = ${sha}"
          # Objects from another toolchain are never restored.
          tc=$(tools/libcarla_cache_guard.sh --toolchain | sha256sum | cut -c1-12)
          {
            echo "sha=${sha}"
            echo "key=libcarla-${RUNNER_OS}-${RUNNER_ARCH}-${OS}-gcc-${GCC}-${tc}-${sha}"
          } >> "$GITHUB_OUTPUT"
      - name: Restore the LibCarla build
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: build
          # CMake files that configure LibCarla and its dependencies. On a
          # change, the newest build of the same CARLA commit and toolchain is
          # restored and CMake/make bring it up to date.
          key: ${{ steps.carla.outputs.key }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: ${{ steps.carla.outputs.key }}-
      - name: Check the restored build (CARLA commit, toolchain)
        env:
          SHA: ${{ steps.carla.outputs.sha }}
          # 'true': exact key; 'false': a restore-key; '': nothing restored.
          HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          tools/libcarla_cache_guard.sh build "$SHA"
          # The CMake files changed: configure afresh, so changed cache
          # defaults apply (the objects are kept; make decides what is stale).
          if [ "$HIT" = false ]; then rm -f build/CMakeCache.txt; fi
      - name: Configure (CARLA ${{ matrix.carla_ref }} @ ${{ steps.carla.outputs.sha }})
        # Built from the SHA; the ref name is what the build records (and
        # what bindgen's `missing_in` matches).
        run: >-
          cmake -S . -B build -DTSC_BACKEND=libcarla -DTSC_CARLA_GIT_REF=${{ steps.carla.outputs.sha }}
          -DTSC_CARLA_REF_NAME=${{ matrix.carla_ref }}
      - name: Build (cache ${{ steps.cache.outputs.cache-hit == 'true' && 'hit' || steps.cache.outputs.cache-hit == 'false' && 'partial hit' || 'miss' }})
        # A bare -j means unlimited jobs; LibCarla/Boost TUs need ~1-2 GB each.
        run: cmake --build build -j "$(nproc)" --target ${{ env.SHIM_TARGETS }}
      # Saved as soon as it is built (a failing test still keeps the build),
      # but not from pull requests: their entries are visible to that PR only
      # and would push main's out of the repository's 10 GB.
      - name: Save the LibCarla build
        if: github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Native ABI tests
        run: ctest --test-dir build --output-on-failure
      # --no-project: only the generator's dependencies, not a second
      # LibCarla build of the package.
      - name: Binding spec vs LibCarla headers
        run: uv run --no-project --with pyyaml --with libclang==18.1.1 --with ziglang==0.13.0 python -m tools.bindgen validate --build-dir build
      # CARLA's own PythonAPI unit tests of the commit this leg built, checked
      # against tests/upstream/expectations.yaml (tests/upstream/README.md).
      # codon mode (compiled with typesafe-codon) runs on every leg. cpython
      # mode needs tools/pycarla, a ~15 min, 7 GB `codon --pyext` build, and
      # its expectations are per CARLA ref, not per toolchain: it runs on one
      # OS per ref. The launcher comes from python/ and Codon from ./toolchain,
      # so the package's LibCarla is not built a second time.
      # The pycarla build is cached, keyed by what it is generated from and the
      # CARLA commit (outside build/, which the LibCarla cache saves).
      - name: Restore the pycarla build
        id: pycarla
        if: matrix.os.runner == 'ubuntu-24.04'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/pycarla
          key: pycarla-${{ runner.os }}-${{ runner.arch }}-${{ steps.carla.outputs.sha }}-${{ hashFiles('codon/**', 'tools/pycarla.py', 'compat/pycarla/**', 'toolchain/**') }}
      - name: CARLA PythonAPI unit tests (${{ matrix.carla_ref }}, ${{ matrix.os.runner == 'ubuntu-24.04' && 'cpython + codon' || 'codon' }})
        env:
          PYTHONPATH: python
          MODE: ${{ matrix.os.runner == 'ubuntu-24.04' && 'all' || 'codon' }}
          TSC_PYCARLA_DIR: ${{ runner.temp }}/pycarla
        run: >-
          uv run --no-project --with ./toolchain --with pyyaml
          python -m tools.upstream_tests --mode "$MODE" --suite unit --summary "$GITHUB_STEP_SUMMARY"
      # A variant the build had to prune (compat/pycarla/pruned.json) is API
      # that disappeared: it must be reviewed and committed, not slip by.
      - name: pycarla prunes nothing new
        if: matrix.os.runner == 'ubuntu-24.04'
        run: git diff --exit-code compat/pycarla/pruned.json
      - name: Save the pycarla build
        if: >-
          matrix.os.runner == 'ubuntu-24.04' && github.event_name != 'pull_request'
          && steps.pycarla.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/pycarla
          key: ${{ steps.pycarla.outputs.cache-primary-key }}
      # A relocatable prefix of the LibCarla just built, which local builds
      # download instead of compiling LibCarla (TSC_CARLA_PREBUILT=auto,
      # tools/fetch_libcarla_prebuilt.py; docs/releasing.md, "LibCarla
      # prebuilt"). Published from main only (pushes and the daily run, which
      # also keeps the 14-day artifacts fresh), after the tests above passed.
      - name: Assemble the LibCarla prebuilt
        id: prebuilt
        if: github.event_name == 'push' || github.event_name == 'schedule'
        env:
          SHA: ${{ steps.carla.outputs.sha }}
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/libcarla-prebuilt"
          cmake --build build --target libcarla_prebuilt
          mv build/libcarla-prebuilt "$prefix"
          du -sh "$prefix"
          # Relocatable: no file names the checkout or the build tree.
          if grep -rIl -e "$GITHUB_WORKSPACE" "$prefix"; then
            echo "::error::the prefix refers to $GITHUB_WORKSPACE"; exit 1
          fi
          name=$(python3 tools/fetch_libcarla_prebuilt.py --print-name "$SHA")
          # The name's ABI hash is the one the manifest records.
          hash=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["abi_hash"])' "$prefix/prebuilt.json")
          case "$name" in
            *-"$hash"-"$SHA") ;;
            *) echo "::error::$name does not carry the manifest's ABI hash $hash"; exit 1 ;;
          esac
          echo "name=${name}" >> "$GITHUB_OUTPUT"
      - name: Build the shim from the prebuilt alone
        if: steps.prebuilt.outcome == 'success'
        env:
          SHA: ${{ steps.carla.outputs.sha }}
          CARLA_REF: ${{ matrix.carla_ref }}
        run: |
          set -euo pipefail
          # Without the build tree, so nothing can come from it.
          mv build "$RUNNER_TEMP/build-aside"
          trap 'mv "$RUNNER_TEMP/build-aside" build' EXIT
          cmake -S . -B "$RUNNER_TEMP/build-prebuilt" -DTSC_BACKEND=libcarla -DTSC_CARLA_GIT_REF="$SHA" \
            -DTSC_CARLA_REF_NAME="$CARLA_REF" -DTSC_CARLA_PREBUILT_DIR="$RUNNER_TEMP/libcarla-prebuilt"
          cmake --build "$RUNNER_TEMP/build-prebuilt" -j "$(nproc)" --target ${{ env.SHIM_TARGETS }}
          ctest --test-dir "$RUNNER_TEMP/build-prebuilt" --output-on-failure
      - name: Publish the LibCarla prebuilt
        if: steps.prebuilt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prebuilt.outputs.name }}
          path: ${{ runner.temp }}/libcarla-prebuilt
          retention-days: 14
          if-no-files-found: error
          overwrite: true  # a re-run of the job
      # Slow (minutes): one leg, and only for main and the daily run.
      - name: LibCarla API coverage report
        if: >-
          matrix.os.runner == 'ubuntu-24.04' && matrix.carla_ref == 'ue5-dev' &&
          (github.event_name == 'push' || github.event_name == 'schedule')
        run: |
          uv run --no-project --with pyyaml --with libclang==18.1.1 --with ziglang==0.13.0 python -m tools.bindgen coverage --build-dir build -o coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

  wheel:
    # The wheel used from a clean environment outside the checkout, so nothing
    # can fall back to repository paths. (Mock backend to keep it fast; the
    # release workflow builds and checks the LibCarla wheel.)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build wheels
        run: |
          uv build --wheel toolchain -o dist
          TSC_BACKEND=mock uv build --wheel -o dist
      - name: Install into a clean environment and run an example
        run: |
          mkdir "$RUNNER_TEMP/clean" && cp examples/connect.py "$RUNNER_TEMP/clean/"
          cd "$RUNNER_TEMP/clean"
          uv venv --python 3.10  # the oldest supported version is the riskiest
          uv pip install --find-links "$GITHUB_WORKSPACE/dist" typesafe-carla
          .venv/bin/typesafe-codon info
          .venv/bin/typesafe-codon run connect.py
          .venv/bin/typesafe-codon build -release -o connect connect.py
          env -u TYPESAFE_CARLA_LIB ./connect
