# Obstacle-detection events (issue #24): tsc_obstacle_detection_<name>, on a
# sensor data handle holding a carla::sensor::data::ObstacleDetectionEvent
# (TSC_TYPE_ERROR otherwise).
class: carla::sensor::data::ObstacleDetectionEvent
prefix: obstacle_detection
self: {type: const tsc_sensor_data_t, name: data, get: obstacle_event_of}
blocks:
  obstacle_detection:
    get_distance: {call: GetDistance, out: double, doc: "Distance to the obstacle, in meters."}
    get_actor: {call: GetActor, out: actor_handle, doc: "The sensor's parent; *out = NULL (TSC_OK) when LibCarla gives none."}
    get_other_actor: {call: GetOtherActor, out: actor_handle, doc: "The obstacle; *out = NULL (TSC_OK) when LibCarla gives none."}
