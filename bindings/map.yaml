# Map operations: tsc_map_<name>.
class: carla::client::Map
prefix: map
self: {type: const tsc_map_t, name: map, get: map_of}
blocks:
  map_new:
    new_from_opendrive:
      new: true
      via: new_map_from_opendrive
      args: {name: string_in, xodr_content: string_in}
      out: map_handle
      doc: >-
        carla.Map(name, xodr_content), no server. TSC_ERROR when the XML does not parse;
        bad OpenDRIVE may give another status, or crash LibCarla (a road without planView).
  map_core:
    get_name: {call: GetName, out: string}
    to_opendrive: {call: GetOpenDrive, out: string}
    get_spawn_points:
      call: GetRecommendedSpawnPoints
      out: transform_buffer
      doc: "Two-call pattern: pass out=NULL to get the count. Copies min(capacity, n)."
    get_waypoint:
      call: GetWaypoint
      args: {location: location, project_to_road: bool, lane_type: int32}
      out: waypoint_or_null
      doc: "*out = NULL (TSC_OK) when no waypoint matches. lane_type: CARLA LaneType bits."
    generate_waypoints:
      call: GenerateWaypoints
      args: {distance: positive}
      out: waypoint_list
  map_topology:
    get_topology:
      call: GetTopology
      out: waypoint_pair_list
      doc: "Lane segments (begin, end) as a waypoint list [b0, e0, b1, e1, ...]."
    get_crosswalks:
      call: GetAllCrosswalkZones
      out: location_buffer
      doc: "Two-call pattern, like tsc_map_get_spawn_points."
  map_landmarks:
    get_all_landmarks: {call: GetAllLandmarks, out: landmark_list}
    get_landmarks_of_type:
      call: GetAllLandmarksOfType
      args: {type: string_in}
      out: landmark_list
  map:
    get_georeference: {call: GetGeoReference, out: geo_location}
    get_waypoint_xodr:
      call: GetWaypointXODR
      args: {road_id: uint32, lane_id: int32, s: finite}
      out: waypoint_or_null
      doc: "*out = NULL (TSC_OK) when the road or lane does not exist."
    get_landmarks_from_id:
      call: GetLandmarksFromId
      args: {opendrive_id: string_in}
      out: landmark_list
    get_landmark_group: {call: GetLandmarkGroup, args: {landmark: landmark}, out: landmark_list}
    cook_in_memory_map:
      call: CookInMemoryMap
      args: {path: string_in}
      doc: >-
        Writes the Traffic Manager's in-memory map; empty path: "<map name>.bin".
        LibCarla only logs a file that cannot be opened.
  # CARLA ue58-dev's road model. Not in LibCarla ue5-dev or 0.10.0.
  map_roads:
    get_roads: {call: GetRoads, out: road_list, optional: {name: Map.get_roads, missing_in: ["0.10.0", "ue5-dev"]}}
    get_road:
      call: GetRoad
      args: {road_id: uint32}
      out: road_or_null
      optional: {name: Map.get_road, missing_in: ["0.10.0", "ue5-dev"]}
      doc: "*out = NULL (TSC_OK) when there is no such road."
    get_lane_section:
      call: GetLaneSection
      args: {road_id: uint32, section_id: uint32}
      out: lane_section_or_null
      optional: {name: Map.get_lane_section, missing_in: ["0.10.0", "ue5-dev"]}
    get_lane:
      call: GetLane
      args: {road_id: uint32, section_id: uint32, lane_id: int32}
      out: lane_or_null
      optional: {name: Map.get_lane, missing_in: ["0.10.0", "ue5-dev"]}
    get_junctions: {call: GetJunctions, out: junction_list, optional: {name: Map.get_junctions, missing_in: ["0.10.0", "ue5-dev"]}}
    get_junction_by_id:
      call: GetJunctionById
      args: {junction_id: int32}
      out: junction_or_null
      optional: {name: Map.get_junction_by_id, missing_in: ["0.10.0", "ue5-dev"]}
