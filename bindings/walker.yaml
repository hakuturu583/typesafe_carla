# Walker operations: tsc_walker_<name>, accepting walker handles (issue #20).
class: carla::client::Walker
prefix: walker
self: {type: tsc_walker_t, name: walker, get: walker_of}
blocks:
  walker_control:
    apply_control: {call: ApplyControl, args: {control: walker_control}}
    get_control: {call: GetWalkerControl, out: walker_control}
  walker_bones:
    set_bones: {call: SetBonesTransform, args: {bones: bone_transforms}}
  walker_bone_list:
    get_bones: {call: GetBonesTransform, out: bone_list_handle}
  walker_pose:
    blend_pose:
      call: BlendPose
      args: {blend: finite}
      doc: "blend: 0 = animation, 1 = the custom pose set with tsc_walker_set_bones."
    show_pose: {call: ShowPose}
    hide_pose: {call: HidePose}
    get_pose_from_animation: {call: GetPoseFromAnimation}
