  to_carla: 'to_enum<carla::rpc::VehicleWheelLocation>({}, TSC_WHEEL_FL, TSC_WHEEL_BR, "wheel location")'
  invalid: 99
  cpp: ["carla::rpc::VehicleWheelLocation"]
