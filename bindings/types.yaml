vehicle_door:
  c: int32_t
  codon: i32
  to_carla: 'to_enum<carla::rpc::VehicleDoor>({}, TSC_VEHICLE_DOOR_FL, TSC_VEHICLE_DOOR_ALL, "vehicle door")'
