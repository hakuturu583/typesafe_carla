  cpp: ["carla::rpc::VehicleFailureState"]
# Output buffer of transforms, two-call pattern (see bounding_box_buffer).
transform_buffer:
  c: tsc_transform_t
  c_param: "tsc_transform_t *{name}, size_t capacity, size_t *{name}_count"
  codon: "Ptr[CTransform], int, Ptr[int]"
  assign: "copy_out({}, {out}, capacity, {out}_count)"
  invalid: "NULL, 0, NULL"
  cpp: ["std::vector<carla::geom::Transform.*>"]
# --- #23 ---
# Any actor handle (plain or derived kind) passed as a LibCarla ActorPtr.
actor:
  c: tsc_actor_t
