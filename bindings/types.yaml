# Value types the binding generator knows (tools/bindgen).
#
#   c          C ABI type. `struct` types cross by pointer (const T * in,
#              T * out); Codon passes an @tuple by value as separate scalars.
#   codon      the matching Codon FFI type
#   to_carla   C++ expression converting the C value `{}` for LibCarla
#              (`{name}` is the parameter name); default: `{}`
#   from_carla C++ expression converting the LibCarla value `{}` to C;
#              default: `{}`
#   invalid    a C value the conversion rejects (tests/native/test_generated.c
#              passes it next to a NULL handle); default: 0
#   c_param    C parameter(s) when not the default `c name` (input) or
#              `c *name` (output); `{name}` is the parameter name. codon and
#              invalid then list one value per C parameter.
#   assign     an output written by a statement instead of `*out = ...`
#              (`{out}` is the output name)
#   cpp        regexes, one of which the canonical LibCarla parameter or
#              return type must match (checked with libclang)

bool:
  c: int32_t
  codon: i32
  to_carla: "{} != 0"
  from_carla: "{} ? 1 : 0"
  cpp: ["bool"]
uint16:
  c: uint16_t
  codon: u16
  cpp: ["unsigned short", "uint16_t"]
uint32:
  c: uint32_t
  codon: u32
  cpp: ["unsigned int", "uint32_t"]
uint64:
  c: uint64_t
  codon: u64
  cpp: ["unsigned long( long)?", "uint64_t"]
double:
  c: double
  codon: float
  cpp: ["float", "double"]
# A finite float; NaN and infinities are rejected.
finite:
  c: double
  codon: float
  to_carla: 'check_finite({}, "{name}")'
  invalid: NAN
  cpp: ["float"]
# A finite, non-negative float (durations, distances, speeds).
non_negative:
  c: double
  codon: float
  to_carla: 'check_non_negative({}, "{name}")'
  invalid: NAN
  cpp: ["float"]
vector3d:
  c: tsc_vector3d_t
  struct: true
  codon: CVector3D
  to_carla: "to_carla_vector({})"
  from_carla: "from_carla({})"
  cpp: ["carla::geom::Vector3D"]
location:
  c: tsc_location_t
  struct: true
  codon: CVector3D
  to_carla: "to_carla({})"
  from_carla: "from_carla({})"
  cpp: ["carla::geom::Location"]
transform:
  c: tsc_transform_t
  struct: true
  codon: CTransform
  to_carla: "to_carla({})"
  from_carla: "from_carla({})"
  cpp: ["carla::geom::Transform"]
bounding_box:
  c: tsc_bounding_box_t
  struct: true
  codon: CBoundingBox
  from_carla: "from_carla({})"
  cpp: ["carla::geom::BoundingBox"]
string:
  c: tsc_string_t
  struct: true
  codon: CString
  # Output only: the caller frees it with tsc_string_free.
  assign: "string_assign({out}, {})"
  cpp: ["std::(__cxx11::)?basic_string<char.*>"]
# VehicleLightState bit flags.
vehicle_light_state:
  c: uint32_t
  codon: u32
  to_carla: "static_cast<carla::client::Vehicle::LightState>({})"
  from_carla: "static_cast<uint32_t>({})"
  cpp: ["carla::rpc::VehicleLightState::LightState"]
# tsc_traffic_light_state_t; out-of-range values are rejected.
traffic_light_state:
  c: int32_t
  codon: i32
  to_carla: "to_light_state({})"
  invalid: 99
  from_carla: "static_cast<int32_t>({})"
  cpp: ["carla::rpc::TrafficLightState"]
# A vehicle handle passed to the Traffic Manager.
vehicle:
  c: tsc_vehicle_t
  handle: true
  codon: cobj
  to_carla: 'vehicle_ptr({}, "{name}")'
  cpp: ["(boost|std)::shared_ptr<carla::client::Actor>"]
# --- #22 ---
int32:
  c: int32_t
  codon: i32
  cpp: ["int", "int32_t"]
# A non-negative, finite search distance in meters (LibCarla takes a double).
distance:
  c: double
  codon: float
  to_carla: 'check_search_distance({}, "{name}")'
  invalid: NAN
  cpp: ["double"]
# An input string as a (pointer, length) pair; NULL only with length 0.
string_in:
  c: const char *
  c_param: "const char *{name}, size_t {name}_len"
  codon: "cobj, int"
  to_carla: 'to_string({name}, {name}_len, "{name}")'
  invalid: "NULL, 1"
  cpp: ["std::(__cxx11::)?basic_string<char.*>"]
geo_location:
  c: tsc_geo_location_t
  struct: true
  codon: CGeoLocation
  from_carla: "from_carla({})"
  cpp: ["carla::geom::GeoLocation"]
# LaneMarking::LaneChange flags.
lane_change:
  c: int32_t
  codon: i32
  from_carla: "static_cast<int32_t>({})"
  cpp: ["carla::road::element::LaneMarking::LaneChange"]
# A landmark handle argument (tsc_landmark_handle_t).
landmark:
  c: const tsc_landmark_handle_t
  handle: true
  codon: cobj
  to_carla: 'landmark_of({}, "{name}")'
  cpp: ["carla::client::Landmark"]
# Handle outputs: from_carla makes the new handle (NULL: no such object).
waypoint_or_null:
  c: tsc_waypoint_t
  handle: true
  codon: cobj
  from_carla: "waypoint_or_null({})"
  cpp: ["(boost|std)::shared_ptr<carla::client::Waypoint>"]
waypoint_list:
  c: tsc_waypoint_list_t
  handle: true
  codon: cobj
  from_carla: "new tsc_waypoint_list(without_nulls({}))"
  cpp: ["std::vector<(boost|std)::shared_ptr<carla::client::Waypoint>.*>"]
landmark_list:
  c: tsc_landmark_list_t
  handle: true
  codon: cobj
  from_carla: "new tsc_landmark_list(without_nulls({}))"
  cpp: ["std::vector<(boost|std)::shared_ptr<carla::client::Landmark>.*>"]
traffic_light_list:
  c: tsc_traffic_light_list_t
  handle: true
  codon: cobj
  from_carla: "new tsc_traffic_light_list(without_nulls({}))"
  cpp: ["std::vector<(boost|std)::shared_ptr<carla::client::TrafficLight>.*>"]
# Output buffers, two-call pattern: fills up to `capacity` values and reports
# the total in *out_count (out may be NULL to only count).
bounding_box_buffer:
  c: tsc_bounding_box_t
  c_param: "tsc_bounding_box_t *{name}, size_t capacity, size_t *{name}_count"
  codon: "Ptr[CBoundingBox], int, Ptr[int]"
  assign: "copy_out({}, {out}, capacity, {out}_count)"
  invalid: "NULL, 0, NULL"
  cpp: ["std::vector<carla::geom::BoundingBox.*>"]
lane_validity_buffer:
  c: tsc_lane_validity_t
  c_param: "tsc_lane_validity_t *{name}, size_t capacity, size_t *{name}_count"
  codon: "Ptr[CLaneValidity], int, Ptr[int]"
  assign: "copy_out({}, {out}, capacity, {out}_count)"
  invalid: "NULL, 0, NULL"
  cpp: ["std::vector<carla::road::LaneValidity.*>"]
# An optional lane marking: *has_value = 0 (and *out zeroed) when there is none.
optional_lane_marking:
  c: tsc_lane_marking_t
  c_param: "int32_t *has_value, tsc_lane_marking_t *{name}"
  codon: "Ptr[i32], Ptr[CLaneMarking]"
  assign: "assign_optional({}, has_value, {out})"
  invalid: "NULL, NULL"
  cpp: ["(boost|std)::optional<carla::road::element::LaneMarking>"]
# --- #20 ---
vehicle_ackermann_control:
  c: tsc_vehicle_ackermann_control_t
  struct: true
  codon: CVehicleAckermannControl
  to_carla: "to_carla({})"
  cpp: ["carla::rpc::VehicleAckermannControl"]
ackermann_controller_settings:
  c: tsc_ackermann_controller_settings_t
