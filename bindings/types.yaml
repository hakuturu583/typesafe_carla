  cpp: ["std::array<float, 16>"]
# Handle outputs: a new handle of the result.
world_handle:
  c: tsc_world_t
  handle: true
  cpp: ["carla::client::World"]
map_handle:
  c: tsc_map_t
  handle: true
  cpp: ["(boost|std)::shared_ptr<carla::client::Map>"]
world_snapshot_handle:
  c: tsc_world_snapshot_t
  handle: true
  cpp: ["carla::client::WorldSnapshot"]
actor_list_handle:
  c: tsc_actor_list_t
  handle: true
  cpp: ["(boost|std)::shared_ptr<carla::client::ActorList>"]
blueprint_library_handle:
  c: tsc_blueprint_library_t
  handle: true
  cpp: ["(boost|std)::shared_ptr<carla::client::BlueprintLibrary>"]
traffic_manager_handle:
  c: tsc_traffic_manager_t
  handle: true
  cpp: ["carla::traffic_manager::TrafficManager"]
physics_control_handle:
  c: tsc_physics_control_t
  handle: true
  cpp: ["carla::rpc::VehiclePhysicsControl"]
bone_list_handle:
  c: tsc_bone_list_t
  handle: true
  from_carla: "new tsc_bone_list({}.bone_transforms)"
  cpp: ["carla::rpc::WalkerBoneControlOut"]
# The spawned actor; LibCarla never returns NULL here (TSC_ERROR if it did).
spawned_actor:
  c: tsc_actor_t
  handle: true
  from_carla: "make_actor_handle(spawned({}))"
  cpp: ["(boost|std)::shared_ptr<carla::client::Actor>"]
junction_or_null:
  c: tsc_junction_t
  handle: true
  from_carla: "new_or_null<tsc_junction>({})"
  cpp: ["(boost|std)::shared_ptr<carla::client::Junction>"]
# Pairs (begin, end) as one list [b0, e0, b1, e1, ...].
waypoint_pair_list:
  c: tsc_waypoint_list_t
  handle: true
  from_carla: "new tsc_waypoint_list(flatten({}))"
  cpp: ["std::vector<std::pair<(boost|std)::shared_ptr<carla::client::Waypoint>.*"]
# List elements (bindings/lists.yaml).
index: {c: size_t, codon: int, cpp: ["unsigned long", "size_t"]}
blueprint_handle: {c: tsc_actor_blueprint_t, handle: true}
# A list element LibCarla should never have left NULL (TSC_ERROR if it did).
waypoint_handle: {c: tsc_waypoint_t, handle: true, from_carla: 'new tsc_waypoint(non_null({}, "waypoint"))'}
landmark_handle:
  c: tsc_landmark_handle_t
  handle: true
  from_carla: 'new tsc_landmark_handle(non_null({}, "landmark"))'
landmark_info: {c: tsc_landmark_t, struct: true, codon: CLandmark, from_carla: "from_carla(*{})"}
bone_transform: {c: tsc_bone_transform_out_t, struct: true, codon: CBoneTransformOut, from_carla: "from_carla({})"}
actor_snapshot: {c: tsc_actor_snapshot_t, struct: true, codon: CActorSnapshot}
