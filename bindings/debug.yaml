# DebugHelper operations: tsc_debug_<name> (on a world).
class: carla::client::DebugHelper
prefix: debug
self: {type: tsc_world_t, name: world, get: debug_of}
blocks:
  debug_draw:
    draw_point:
      call: DrawPoint
      args: {location: location, size: double, color: color, life_time: finite}
    draw_line:
      call: DrawLine
      args: {begin: location, end: location, thickness: double, color: color, life_time: finite}
    draw_arrow:
      call: DrawArrow
      args: {begin: location, end: location, thickness: double, arrow_size: double, color: color,
             life_time: finite}
    draw_box:
      call: DrawBox
      args: {box: bounding_box_in, rotation: rotation, thickness: double, color: color,
             life_time: finite}
    draw_string:
      call: DrawString
      args: {location: location, text: string_in, draw_shadow: bool, color: color,
             life_time: finite}
  debug_clear:
    clear_shapes:
      call: ClearDebugShape
      optional: {name: DebugHelper.clear_debug_shape, missing_in: ["0.10.0"]}
      doc: "Removes the persistent debug shapes (LibCarla ue5-dev); TSC_ERROR without (0.10.0)."
    clear_strings:
      call: ClearDebugString
      optional: {name: DebugHelper.clear_debug_string, missing_in: ["0.10.0"]}
      doc: "Removes the persistent debug strings; TSC_ERROR as tsc_debug_clear_shapes."
