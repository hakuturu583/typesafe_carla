# ActorBlueprint operations: tsc_actor_blueprint_<name>. The older ones
# (id, attributes) and BlueprintLibrary are hand-written (native/src/blueprint.cpp).
class: carla::client::ActorBlueprint
prefix: actor_blueprint
self: {type: tsc_actor_blueprint_t, name: blueprint, get: blueprint_of}
blocks:
  actor_blueprint_tags:
    get_tags: {call: GetTags, out: string_list}
    match_tags:
      call: MatchTags
      args: {pattern: string_in}
      out: bool
      doc: "Whether the id or any tag matches the shell-style wildcard pattern."
