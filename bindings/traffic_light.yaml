# Traffic light operations: tsc_traffic_light_<name>.
class: carla::client::TrafficLight
prefix: traffic_light
self: {type: tsc_traffic_light_t, name: light, get: light_of}
blocks:
  traffic_light:
    set_state: {call: SetState, args: {state: traffic_light_state}}
    set_green_time: {call: SetGreenTime, args: {t: non_negative}}
    set_yellow_time: {call: SetYellowTime, args: {t: non_negative}}
    set_red_time: {call: SetRedTime, args: {t: non_negative}}
    freeze: {call: Freeze, args: {freeze: bool}}
    reset_group: {call: ResetGroup}
  traffic_light_geometry:
    get_opendrive_id: {call: GetOpenDRIVEID, out: string}
    get_trigger_volume: {call: GetTriggerVolume, out: bounding_box}
    get_light_boxes:
      call: GetLightBoxes
      out: bounding_box_buffer
      doc: "Fills up to `capacity` boxes, the total in *out_count (one server call)."
    get_affected_lane_waypoints: {call: GetAffectedLaneWaypoints, out: waypoint_list}
    get_stop_waypoints: {call: GetStopWaypoints, out: waypoint_list}
    get_group_traffic_lights: {call: GetGroupTrafficLights, out: traffic_light_list}
